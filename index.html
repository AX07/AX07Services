    <!-- Theme before first paint: the visitor's saved choice, else light (no flash) -->
    <script>

        try { t = localStorage.getItem('ax07-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = 'light';
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0c');
      })();
    </script>

  <body>
    <!-- The particle field, scattered, drawn from the very first paint (before any app code loads) on the home page.
         It fades out when the 3D field has drawn its first frame ("ax07:scene-ready", three/ParticleLogo.tsx),
         which then gathers the same scattered field into the logo. -->
    <canvas id="particle-fallback" aria-hidden="true" style="position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;transition:opacity 1s ease"></canvas>
    <script>
      (function () {
        var c = document.getElementById('particle-fallback');
        if (['/', '/ie', '/pt', '/ie/', '/pt/'].indexOf(location.pathname) < 0) return c.remove();
        var x = c.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var dpr = Math.min(devicePixelRatio || 1, 2), n = innerWidth < 768 ? 2200 : 4200, dots = [], raf = 0, done = false;
        for (var i = 0; i < n; i++) {
          var th = Math.random() * 6.2832, ph = Math.acos(2 * Math.random() - 1), r = 0.2 + Math.pow(Math.random(), 0.7) * 0.8;
          dots.push([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), Math.cos(ph), Math.random()]);
        }
        function draw(t) {
          var w = innerWidth, hh = innerHeight;
          if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(hh * dpr); }
          var s = document.getElementById('hero-logo-slot'), b = s && s.getBoundingClientRect();
          var cx = b && b.width ? b.left + b.width / 2 : w / 2, cy = b && b.height ? b.top + b.height / 2 : hh * 0.36;
          var R = Math.max(w, hh) * 0.5, a = reduce ? 0 : t / 7000;
          x.setTransform(dpr, 0, 0, dpr, 0, 0);
          x.clearRect(0, 0, w, hh);
          x.fillStyle = document.documentElement.dataset.theme === 'dark' ? 'rgba(232,232,237,.7)' : 'rgba(12,13,16,.62)';
          for (var i = 0; i < n; i++) {
            var d = dots[i], k = a * (0.5 + d[3]), z = 1 + d[2] * 0.25, size = (1 + d[3] * 1.4) * z;
            x.fillRect(cx + (d[0] * Math.cos(k) - d[2] * Math.sin(k) * 0.35) * R, cy + d[1] * R * 0.85 + Math.sin(k * 3 + d[3] * 6) * 4, size, size);
          }
          if (!done && !reduce) raf = requestAnimationFrame(draw);
        }
        raf = requestAnimationFrame(draw);
        addEventListener('ax07:scene-ready', function () {
          c.style.opacity = '0';
          setTimeout(function () { done = true; cancelAnimationFrame(raf); c.remove(); }, 1100);
        }, { once: true });
      })();
    </script>
