    <!-- Theme before first paint: the visitor's saved choice, else light (no flash) -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem('ax07-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = 'light';
        var r = document.documentElement;
        r.dataset.theme = t;
        r.style.colorScheme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0a0c');
      })();
    </script>
